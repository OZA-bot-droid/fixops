server:
  port: ${PORT:8083}
spring:
  application:
    name: workorder-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/workorder_db}
    username: ${DB_USER:workorder_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info

# 예약 정책
booking:

  # 기술자 최대 응답 시간
  technician-response-hours: ${BOOKING_TECHNICIAN_RESPONSE_HOURS:24}

  # 예약 요청자 최대 응답 시간
  requester-response-hours: ${BOOKING_REQUESTER_RESPONSE_HOURS:12}

  # 전체 일정 협의 유효기간
  negotiation-expiry-hours: ${BOOKING_NEGOTIATION_EXPIRY_HOURS:48}

  # 방문 전 최소 준비시간
  minimum-lead-hours: ${BOOKING_MINIMUM_LEAD_HOURS:1}

  # 만료 대상 조회 주기 (밀리초)
  expiry-check-interval-ms: ${BOOKING_EXPIRY_CHECK_INTERVAL_MS:60000}

  # 방문 시간 정책
  time-zone: "Asia/Seoul"
  business-start-time: "09:00"
  business-end-time: "20:00"
  slot-interval-minutes: 30
  minimum-duration-minutes: 30
  maximum-duration-minutes: 480
  max-advance-days: 30

  # 방문 제한 날짜
  allow-weekends: false
  allow-holidays: false

  # 공공데이터 API 설정
  holiday-api:
    base-url: "https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService"
    service-key: ${KAPT_SERVICE_KEY}
    connect-timeout: 3s
    read-timeout: 5s

    refresh-after: 24h
    max-stale-age: 7d

    initial-delay-ms: 1000
    sync-interval-ms: 3600000
    prefetch-days: 2
