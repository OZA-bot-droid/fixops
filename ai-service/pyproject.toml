[project]
name = "fixops-ai-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2,<3",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.17,<2",
  "psycopg[binary]>=3.2,<4",
  "langchain[mcp]>=1.4,<2",
  "langchain-openai>=1,<2",
  "python-dotenv>=1.2.4",
  "openai>=3.55.1",
  "pyjwt[crypto]>=2.15.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
