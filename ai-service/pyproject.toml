[project]
name = "fixops-ai-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.12,<3",
  "httpx>=0.27,<1",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.17,<2",
  "psycopg[binary]>=3.2,<4",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
# pyproject and requirements must stay in sync until a tested uv.lock is committed.
