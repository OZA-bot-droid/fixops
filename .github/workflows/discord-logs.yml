name: FixOps Discord Logs

on:
  push:
    branches:
      - main
      - develop
      - docs
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  workflow_run:
    workflows: ['FixOps CI']
    types: [completed]

permissions:
  contents: read

jobs:
  push-log:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_LOGS }}
    steps:
      - name: Prepare safe push description
        id: info
        run: |
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const e = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const safe = (s,n=800) => String(s ?? '').replace(/@/g,'@\u200b').replace(/\r/g,'').slice(0,n);
          const url = e.compare || `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/commit/${process.env.GITHUB_SHA}`;
          const lines = [
            `**Push 작업자:** ${safe(process.env.GITHUB_ACTOR,100)}`,
            `**커밋 작성자:** ${safe(e.head_commit?.author?.name || '알 수 없음',100)}`,
            `**브랜치:** ${safe(process.env.GITHUB_REF_NAME,100)}`,
            `**커밋:** \`${safe(process.env.GITHUB_SHA,45)}\``,
            '', '📝 **커밋 메시지**', safe(e.head_commit?.message || '(메시지 없음)',700)
          ];
          const delimiter = `FIXOPS_${crypto.randomUUID().replace(/-/g,'')}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `body<<${delimiter}\n${lines.join('\n')}\n${delimiter}\nurl=${url}\n`);
          NODE
      - name: Notify push
        if: env.WEBHOOK != ''
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.WEBHOOK }}
          username: FixOps Git Log Bot
          title: '📦 FixOps 코드 PUSH'
          description: ${{ steps.info.outputs.body }}
          url: ${{ steps.info.outputs.url }}
          status: Success
          color: '0x4f545c'
          nodetail: true
          nofail: false

  ci-log:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_LOGS }}
    steps:
      - name: Send CI result
        if: env.WEBHOOK != ''
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ env.WEBHOOK }}
          username: FixOps CI Bot
          title: '⚙️ FixOps CI 검증 결과'
          description: |
            **워크플로:** ${{ github.event.workflow_run.name }}
            **실행자:** ${{ github.event.workflow_run.actor.login }}
            **브랜치:** ${{ github.event.workflow_run.head_branch }}
            **결과:** `${{ github.event.workflow_run.conclusion }}`

            🔗 [검증 로그 확인](${{ github.event.workflow_run.html_url }})
          url: ${{ github.event.workflow_run.html_url }}
          status: ${{ github.event.workflow_run.conclusion == 'success' && 'Success' || github.event.workflow_run.conclusion == 'cancelled' && 'Cancelled' || 'Failure' }}
          color: '0x4f545c'
          nodetail: true
          nofail: false
