name: FixOps CI
on:
  push:
    branches: [main, develop, docs, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
concurrency:
  group: fixops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-team-contract.py
  java:
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, member-service, asset-service, workorder-service, inventory-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Java Build
        working-directory: ${{ matrix.service }}
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar || { echo 'Generate and commit Gradle wrapper first'; exit 1; }
          chmod +x gradlew
          ./gradlew clean test bootJar --no-daemon
  frontend:
    needs: contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  python:
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ai-service, mcp-server]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate locked dependencies
        run: uv sync --locked --group dev
      - name: Python syntax
        run: uv run --locked python -m compileall -q app
      - name: Import smoke checks
        shell: bash
        run: |
          if [ "${{ matrix.service }}" = "ai-service" ]; then
            uv run --locked python -c "from app.schemas.chat import ChatRequest; from app.db.base import Base; assert ChatRequest(message='ping').message == 'ping'; assert Base.metadata is not None"
          else
            uv run --locked python -c "from app.server import mcp; assert mcp is not None; from app.health_app import app; assert app is not None"
          fi
