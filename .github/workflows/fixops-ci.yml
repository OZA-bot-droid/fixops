name: FixOps CI

on:
  push:
    branches:
      - main
      - develop
      - docs
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, member-service, asset-service, workorder-service, inventory-service]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build and test service
        env:
          SERVICE: ${{ matrix.service }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$SERVICE/build.gradle" && ! -f "$SERVICE/build.gradle.kts" ]]; then
            echo "::warning title=Java scaffold not ready::$SERVICE build.gradle is missing; skipping until service is initialized"
            echo "- $SERVICE: Gradle project not yet created (SKIPPED)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Each service owns its build. The CI runner has a pinned Gradle installed.
          gradle -p "$SERVICE" clean build --no-daemon

  frontend:
    name: React - build and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Require committed lockfile
        run: |
          if [[ ! -f package-lock.json ]]; then
            echo '::error::frontend/package-lock.json is required; run npm install locally and commit it'
            exit 1
          fi
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint (when defined)
        run: npm run lint --if-present
      - name: Build
        run: npm run build

  python:
    name: Python - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ai-service, mcp-server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
      - name: Install and test
        env:
          SERVICE: ${{ matrix.service }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$SERVICE/pyproject.toml" ]]; then
            echo "::warning title=Python scaffold not ready::$SERVICE pyproject.toml missing; skipping"
            echo "- $SERVICE: Python project not yet created (SKIPPED)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ ! -f "$SERVICE/uv.lock" ]]; then
            echo "::error::$SERVICE/uv.lock missing; generate and commit with uv lock"
            exit 1
          fi
          cd "$SERVICE"
          uv sync --locked --all-groups
          uv run python -m compileall -q app
          if uv run python -c 'import importlib.util,sys; sys.exit(0 if importlib.util.find_spec("pytest") else 1)'; then
            uv run pytest -q
          else
            echo '::warning title=pytest missing::Add pytest to dev dependencies for this service'
          fi

  # Do not mark optional/unfinished service tests as production-ready.
  # Mandatory check contexts should be enabled only after lockfiles and builds are verified.
