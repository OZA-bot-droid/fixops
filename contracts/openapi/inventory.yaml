openapi: 3.1.0
info:
  title: FixOps Inventory API
  version: 0.1.0-draft
  description: |
    재고(Inventory) 서비스 P0 API. 소유자 이도관.
    기준 문서: docs/04(API·오류 계약), docs/06(재고 정합성), docs/02(ERD).

    D5 결정 사항 (2026-11-23)
      - 재고 차감은 SELECT ... FOR UPDATE 로 잔액 행을 잠근 뒤 처리한다.
        여러 부품을 한 번에 차감할 때는 교착을 막기 위해 part_id 오름차순으로 잠근다.
      - 작업 취소 시 재고 반환은 WorkOrder 서비스가 Inventory 반환 API를 호출한다.
        반환용 멱등 키는 차감 키 앞에 'return-' 접두사를 붙인다.

    D6 결정 사항 (2026-11-24)
      - SKU 중복은 409 DUPLICATE_SKU (docs/04 추가 요청 필요). details 에 기존 partId, partStatus.
      - 목록 정렬 허용 필드는 sku, name, quantity.
      - 부품 수정(PATCH)은 name, category, unit, safetyStock 만. sku, 수량, status 는 수정 불가.
      - 재고가 남은 부품은 비활성화하지 않는다. 

    D7 결정 사항 (2026-11-24)
      - 입고 메모(note)는 stock_movement.note 에 저장한다 (V2 마이그레이션).
      - 비활성(INACTIVE) 부품에는 입고할 수 없다: 409 PART_INACTIVE (docs/04 추가 요청 필요).
      - Idempotency-Key 헤더와 본문 operationKey 는 같은 값이어야 한다. 다르면 400.

    D8 결정 사항 (2026-11-25)
      - 부품 사용은 작업이 IN_PROGRESS 일 때만 가능: 그 밖은 409 WORK_ORDER_NOT_IN_PROGRESS (docs/04 추가 요청 필요).
      - ADMIN 은 단지 안 모든 작업, TECHNICIAN 은 자기에게 배정된 작업만 (아니면 403).
      - 작업이 없거나 다른 단지 작업이면 404. 부품이 없거나 다른 단지 부품이어도 404.
      - 같은 operationKey 재시도는 WorkOrder 확인 없이 처음 결과를 200 으로 돌려준다.
      - WorkOrder 조회 API 연결 전까지는 503. 개발용 가짜(FakeWorkOrderClient)는 설정으로만 켠다.

    D11 결정 사항 (2026-11-26)
      - 부품 사용 시 실제 WorkOrder API(GET /work-orders/{id})로 작업 상태·조직·배정 기사를 확인한다.
      - 사용자의 Authorization(JWT)을 WorkOrder 호출에 그대로 전달한다 (WorkOrder 도 JWT 방식으로 전환 예정, 박천보 확인).
      - WorkOrder 응답 오류 변환: 404→404, 401→401, 403→403, 400·5xx·시간 초과·연결 실패→503 (차감하지 않음).
      - 부품 사용 가능 상태는 IN_PROGRESS 만으로 확정 (기사가 작업 시작 시 IN_PROGRESS 로 바뀜, 박천보 확인).

    D12 결정 사항 (2026-11-27, 팀장 승인)
      - 조회 API 추가: GET /inventory/movements (재고 변동 이력, ADMIN), GET /inventory/usages (작업별 사용 내역, ADMIN·TECHNICIAN).
      - 재고는 조직 단위로 관리한다. complexId 는 권한 확인(Member)에만 쓰고 데이터를 단지별로 나누지 않는다.
      - 부품 요청(TECHNICIAN 요청 → ADMIN 승인·반려) 추가 승인. 승인은 기록만 하고 재고는 관리자가 입고로 늘린다.
      - GET·PATCH /inventory/parts/{partId} 승인 완료.

    미결 항목 (확정되면 본 문서에 반영)
      1. 비활성 부품과 같은 SKU 등록 시 동작. 본 문서는 409 + 기존 partId 안내로 제안.
      2. 재고가 남은 부품의 비활성화 허용 여부. 본 문서에는 비활성화 API 미포함(P0 제외 제안).
      3. (D7 확정) Idempotency-Key 헤더와 본문 operationKey 는 같은 값 필수. 입고·사용 모두 적용.
      4. 목록 응답 형식(content/page/size/totalElements) 통일 - Asset, WorkOrder와 협의 중.
      5. WorkOrder 상태 조회 내부 API의 주소, 응답 필드(status, assignedTechnicianId, organizationId), 서비스 간 인증 방식 - 박천보 협의 중.
      6. 재고 반환 API는 docs/04 필수 API 목록에 없음. 추가에 대한 팀장 승인 필요.

servers:
  - url: https://{host}/api
    variables:
      host:
        default: 127.0.0.1:8080
        description: Gateway 경유

security:
  - bearerAuth: []

tags:
  - name: parts
    description: 부품 기준 정보
  - name: stock
    description: 입고·사용에 따른 재고 변동
  - name: requests
    description: 기술자의 부품 요청과 관리자의 승인·반려 (D12)

paths:
  /inventory/parts:
    get:
      tags: [parts]
      summary: 부품 목록 조회
      description: 호출자 조직의 부품만 반환한다. 기본은 ACTIVE만 보여 준다.
      operationId: listParts
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
        - name: q
          in: query
          description: SKU 또는 이름 부분 일치
          schema: { type: string, maxLength: 100 }
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, ALL]
            default: ACTIVE
        - name: lowStockOnly
          in: query
          description: 안전재고 미만만 조회
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PartPage' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OrgAccessDenied' }

    post:
      tags: [parts]
      summary: 부품 등록
      description: |
        ADMIN만 호출한다. 등록과 동시에 수량 0인 재고 잔액 행을 같은 트랜잭션에서 만든다.
        같은 조직에서 SKU는 중복될 수 없다.
      operationId: createPart
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartCreateRequest' }
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Part' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OrgAccessDenied' }
        '409':
          description: |
            같은 조직에 같은 SKU가 이미 있습니다. 기존 부품이 INACTIVE이면 재활성화를 안내한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                duplicateSku:
                  value:
                    success: false
                    error:
                      code: DUPLICATE_SKU
                      message: "이미 등록된 SKU입니다."
                      details: { partId: 92, partStatus: INACTIVE }
                    traceId: trace-id-example
                    timestamp: '2026-11-20T04:00:00Z'

  /inventory/parts/{partId}:
    get:
      tags: [parts]
      summary: 부품 하나 조회
      description: |
        ⏳ 팀장 승인 대기 (docs/04 필수 API 목록에 없음). MCP get_part_stock 의 원본.
        ADMIN, TECHNICIAN. 부품 정보와 현재 수량. 다른 조직의 부품이면 404.
      operationId: getPart
      parameters:
        - name: partId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Part' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OrgAccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [parts]
      summary: 부품 정보 수정
      description: |
        ADMIN만 호출한다. 보낸 항목만 바꾼다(최소 1개). sku, 재고 수량, status 는 바꿀 수 없다.
        다른 조직의 부품이면 404.
      operationId: updatePart
      parameters:
        - name: partId
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartUpdateRequest' }
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Part' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OrgAccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }

  /inventory/receipts:
    post:
      tags: [stock]
      summary: 입고
      description: |
        ADMIN만 호출한다. 재고를 늘리고 원장에 RECEIPT 행을 추가한다.
        잔액 증가와 원장 삽입은 같은 트랜잭션이다.
      operationId: createReceipt
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiptRequest' }
      responses:
        '201':
          description: 입고 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockChangeResult' }
        '200':
          description: 같은 operationKey의 재시도. 추가 입고 없이 최초 결과를 재전달한다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/StockChangeResult' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OrgAccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            IDEMPOTENCY_KEY_REUSE : 같은 operationKey 로 다른 내용(부품·수량)을 보냄.
            PART_INACTIVE         : 비활성 부품에는 입고할 수 없음.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /inventory/part-requests:
    get:
      tags: [requests]
      summary: 부품 요청 목록
      description: D12. ADMIN 은 조직 전체, TECHNICIAN 은 자기 요청만 (서버가 정한다). 최신순.
      operationId: listPartRequests
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: status
          in: query
          schema: { type: string, enum: [REQUESTED, APPROVED, REJECTED] }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PartRequestPage' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OrgAccessDenied' }
    post:
      tags: [requests]
      summary: 부품 요청 등록
      description: |
        D12. ADMIN, TECHNICIAN. 재고는 바뀌지 않는다.
        등록된 부품은 partId 만 보내면 서버가 부품 정보로 채운다.
        목록에 없는 새 부품은 partName·sku 필수, 이미 있는 SKU 면 409 DUPLICATE_SKU.
      operationId: createPartRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartRequestCreateRequest' }
      responses:
        '201':
          description: 요청 등록됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PartRequest' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OrgAccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: DUPLICATE_SKU (새 부품인데 이미 등록된 SKU)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /inventory/part-requests/{requestId}/approve:
    post:
      tags: [requests]
      summary: 부품 요청 승인 (기록만)
      description: D12. ADMIN. 재고는 바뀌지 않는다. 실제 입고는 POST /inventory/receipts 로 따로 등록한다.
      operationId: approvePartRequest
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      responses:
        '200':
          description: 승인됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PartRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OrgAccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE_TRANSITION (이미 승인·반려된 요청)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /inventory/part-requests/{requestId}/reject:
    post:
      tags: [requests]
      summary: 부품 요청 반려 (사유 필수)
      operationId: rejectPartRequest
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejectReason]
              properties:
                rejectReason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: 반려됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PartRequest' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OrgAccessDenied' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: INVALID_STATE_TRANSITION (이미 승인·반려된 요청)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /inventory/movements:
    get:
      tags: [stock]
      summary: 재고 변동 이력 (원장) 조회
      description: |
        D12. 호출자 조직의 원장(stock_movement)을 최신순으로 반환한다. ADMIN 만.
        balanceAfter 는 저장값이 아니라 같은 부품의 원장을 시간 순으로 더한 값이다 (재고 = 원장의 합).
      operationId: listMovements
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: partId
          in: query
          description: 주면 그 부품 하나의 이력만
          schema: { type: integer, format: int64, minimum: 1 }
        - name: type
          in: query
          schema:
            type: string
            enum: [RECEIPT, USAGE, STOCK_RETURN, ADJUSTMENT]
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MovementPage' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OrgAccessDenied' }

  /inventory/usages:
    get:
      tags: [stock]
      summary: 작업별 부품 사용 내역 조회
      description: D12. 호출자 조직의 부품 사용 기록을 최신순으로 반환한다. ADMIN, TECHNICIAN.
      operationId: listUsages
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: workOrderId
          in: query
          description: 주면 그 작업지시에서 쓴 부품만
          schema: { type: integer, format: int64, minimum: 1 }
        - name: partId
          in: query
          description: 주면 그 부품을 쓴 기록만
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UsageHistoryPage' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/OrgAccessDenied' }

    post:
      tags: [stock]
      summary: 작업에 부품 사용 (재고 차감)
      description: |
        ADMIN 또는 해당 작업에 배정된 TECHNICIAN만 호출한다.

        처리 순서
        1. WorkOrder 서비스의 인증된 조회 API로 작업의 상태와 배정을 확인한다.
           조회가 실패하면 차감하지 않고 503을 돌려준다. (docs/06)
        2. 같은 트랜잭션에서 잔액 차감, 사용 기록, 원장(USAGE) 삽입을 수행한다.
        3. 동시 요청은 stock_balance 행 잠금으로 순차 처리한다.

        operationKey는 화면을 열 때 한 번 만들고 재시도에도 같은 값을 보낸다.
        같은 키의 재요청은 추가 차감 없이 최초 결과를 200으로 재전달한다.
      operationId: createUsage
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsageRequest' }
            examples:
              basic:
                value: { workOrderId: 811, partId: 92, quantity: 2, operationKey: usage-811-92-a }
      responses:
        '201':
          description: 차감 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UsageResult' }
        '200':
          description: 같은 operationKey의 재시도. 추가 차감 없이 최초 결과를 재전달한다.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/UsageResult' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403':
          description: TECHNICIAN 이 자기에게 배정되지 않은 작업에 사용하려 함, 또는 허용되지 않은 역할
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            INSUFFICIENT_STOCK         : 재고 부족
            IDEMPOTENCY_KEY_REUSE      : 같은 operationKey 로 다른 내용
            WORK_ORDER_NOT_IN_PROGRESS : 작업이 진행 중(IN_PROGRESS)이 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                insufficientStock:
                  value:
                    success: false
                    error: { code: INSUFFICIENT_STOCK, message: "재고가 부족합니다." }
                    traceId: trace-id-example
                    timestamp: '2026-11-20T04:00:00Z'
                idempotencyKeyReuse:
                  value:
                    success: false
                    error: { code: IDEMPOTENCY_KEY_REUSE, message: "같은 키로 다른 요청입니다." }
                    traceId: trace-id-example
                    timestamp: '2026-11-20T04:00:00Z'
        '503':
          description: WorkOrder 상태 조회 실패. 차감하지 않는다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              examples:
                dependencyUnavailable:
                  value:
                    success: false
                    error: { code: DEPENDENCY_UNAVAILABLE, message: "작업 정보를 확인할 수 없습니다." }
                    traceId: trace-id-example
                    timestamp: '2026-11-20T04:00:00Z'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: |
        필드,방향 (예: sku,asc). 허용 필드: sku, name, quantity. 방향: asc, desc (생략 시 asc).
        그 외 필드는 400 INVALID_INPUT.
      schema: { type: string, default: 'sku,asc' }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        중복 생성을 막는 키. 단일성은 organization_id + actor_id + operation + key 조합으로 본다. (docs/04)
        receipts, usages 에서는 본문 operationKey 와 같은 값이어야 하며, 다르면 400 으로 거부한다. (D7 확정)
      schema: { type: string, minLength: 8, maxLength: 100 }

  schemas:
    SuccessEnvelope:
      type: object
      required: [success, timestamp]
      properties:
        success: { type: boolean, const: true }
        timestamp: { type: string, format: date-time, description: ISO8601 UTC Z }

    ErrorEnvelope:
      type: object
      required: [success, error, timestamp]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INVALID_INPUT
                - UNAUTHENTICATED
                - ORG_ACCESS_DENIED
                - RESOURCE_NOT_FOUND
                - INSUFFICIENT_STOCK
                - IDEMPOTENCY_KEY_REUSE
                - DUPLICATE_SKU
                - PART_INACTIVE
                - WORK_ORDER_NOT_IN_PROGRESS
                - RATE_LIMITED
                - DEPENDENCY_UNAVAILABLE
            message: { type: string }
            details: { type: object, additionalProperties: true }
        traceId: { type: string }
        timestamp: { type: string, format: date-time }

    Part:
      type: object
      required: [id, sku, name, unit, status, quantity]
      properties:
        id: { type: integer, format: int64, examples: [92] }
        sku: { type: string, maxLength: 64, examples: [BOLT-M8] }
        name: { type: string, maxLength: 200, examples: ['볼트 M8'] }
        category: { type: [string, 'null'], maxLength: 64 }
        unit: { type: string, maxLength: 16, default: EA }
        safetyStock: { type: integer, minimum: 0, examples: [10] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        quantity:
          type: integer
          minimum: 0
          description: 현재 재고 수량 (stock_balance)
          examples: [98]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PartPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Part' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }

    PartCreateRequest:
      type: object
      required: [sku, name]
      properties:
        sku: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, maxLength: 64 }
        unit: { type: string, maxLength: 16, default: EA }
        safetyStock: { type: integer, minimum: 0, default: 0 }

    PartUpdateRequest:
      type: object
      minProperties: 1
      description: sku, quantity, status 를 보내도 무시된다.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        category: { type: string, maxLength: 64 }
        unit: { type: string, minLength: 1, maxLength: 16 }
        safetyStock: { type: integer, minimum: 0 }

    ReceiptRequest:
      type: object
      required: [partId, quantity, operationKey]
      properties:
        partId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1 }
        operationKey: { type: string, minLength: 8, maxLength: 100 }
        note: { type: string, maxLength: 200, description: 입고 메모. stock_movement.note 에 저장 }

    UsageRequest:
      type: object
      required: [workOrderId, partId, quantity, operationKey]
      properties:
        workOrderId: { type: integer, format: int64, examples: [811] }
        partId: { type: integer, format: int64, examples: [92] }
        quantity: { type: integer, minimum: 1, examples: [2] }
        operationKey:
          type: string
          minLength: 8
          maxLength: 100
          description: 입력 화면을 열 때 만들고 재시도에도 같은 값을 쓴다.
          examples: [usage-811-92-a]

    StockChangeResult:
      type: object
      required: [movementId, partId, quantityDelta, remainingQuantity]
      properties:
        movementId: { type: integer, format: int64 }
        partId: { type: integer, format: int64 }
        quantityDelta: { type: integer, description: '입고는 양수, 사용은 음수' }
        remainingQuantity: { type: integer, minimum: 0 }
        occurredAt: { type: string, format: date-time }

    UsageResult:
      type: object
      required: [usageId, workOrderId, partId, quantity, remainingQuantity]
      properties:
        usageId: { type: integer, format: int64 }
        workOrderId: { type: integer, format: int64 }
        partId: { type: integer, format: int64 }
        quantity: { type: integer, minimum: 1 }
        remainingQuantity: { type: integer, minimum: 0 }
        occurredAt: { type: string, format: date-time }

    Movement:
      type: object
      required: [movementId, partId, sku, partName, movementType, quantityDelta, balanceAfter, occurredAt]
      properties:
        movementId: { type: integer, format: int64 }
        partId: { type: integer, format: int64 }
        sku: { type: string }
        partName: { type: string }
        movementType: { type: string, enum: [RECEIPT, USAGE, STOCK_RETURN, ADJUSTMENT] }
        quantityDelta: { type: integer, description: '+ 증가, - 감소' }
        balanceAfter: { type: integer, minimum: 0, description: 이 기록 직후의 재고 }
        workOrderId: { type: [integer, 'null'], format: int64 }
        actorId: { type: [integer, 'null'], format: int64, description: 처리한 회원 번호 }
        note: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }

    MovementPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Movement' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }

    UsageHistory:
      type: object
      required: [usageId, workOrderId, partId, sku, partName, quantity, status, occurredAt]
      properties:
        usageId: { type: integer, format: int64 }
        workOrderId: { type: integer, format: int64 }
        partId: { type: integer, format: int64 }
        sku: { type: string }
        partName: { type: string }
        quantity: { type: integer, minimum: 1 }
        status: { type: string, enum: [ACTIVE, CANCELLED] }
        usedBy: { type: [integer, 'null'], format: int64, description: 사용한 회원 번호 }
        occurredAt: { type: string, format: date-time }

    PartRequestCreateRequest:
      type: object
      required: [quantity]
      properties:
        partId: { type: integer, format: int64, minimum: 1, description: 등록된 부품이면 이것만 }
        partName: { type: string, maxLength: 200, description: 새 부품일 때 필수 }
        sku: { type: string, maxLength: 64, description: 새 부품일 때 필수 }
        category: { type: string, maxLength: 64 }
        unit: { type: string, maxLength: 16 }
        safetyStock: { type: integer, minimum: 0 }
        quantity: { type: integer, minimum: 1, maximum: 100000 }
        workOrderId: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, maxLength: 500 }

    PartRequest:
      type: object
      required: [requestId, partName, quantity, status, requestedBy, requestedAt]
      properties:
        requestId: { type: integer, format: int64 }
        partId: { type: [integer, 'null'], format: int64 }
        partName: { type: string }
        sku: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        unit: { type: [string, 'null'] }
        safetyStock: { type: [integer, 'null'] }
        quantity: { type: integer, minimum: 1 }
        workOrderId: { type: [integer, 'null'], format: int64 }
        reason: { type: [string, 'null'] }
        status: { type: string, enum: [REQUESTED, APPROVED, REJECTED] }
        rejectReason: { type: [string, 'null'] }
        requestedBy: { type: integer, format: int64 }
        decidedBy: { type: [integer, 'null'], format: int64 }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }

    PartRequestPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/PartRequest' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }

    UsageHistoryPage:
      type: object
      required: [content, page, size, totalElements]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/UsageHistory' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }

  responses:
    InvalidInput:
      description: 입력값 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: 로그인 필요 또는 토큰 만료
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    OrgAccessDenied:
      description: 조직 또는 역할 권한 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: 부품 또는 작업을 찾을 수 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    IdempotencyKeyReuse:
      description: 같은 키로 다른 내용의 요청
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
