server:
  port: ${PORT:8082}
spring:
  application:
    name: asset-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/asset_db}
    username: ${DB_USER:asset_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info

fixops:
  building-register:
    service-key: ${BUILDING_REGISTER_SERVICE_KEY:}
  member:
    url: ${MEMBER_SERVICE_URL:http://127.0.0.1:8081}
  internal:
    asset-authz-key: ${ASSET_AUTHZ_KEY:}
    member-unit-key: ${MEMBER_UNIT_INTERNAL_KEY:}
