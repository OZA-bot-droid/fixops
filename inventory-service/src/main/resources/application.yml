# inventory-service 설정
# ${이름:기본값} : 환경 변수가 있으면 그 값을, 없으면 콜론 뒤 기본값을 쓴다 (로컬 개발은 기본값으로 동작).

server:
  port: ${PORT:8084}          # 이 서비스의 포트. Gateway(8080)가 /api/inventory/** 를 여기로 넘긴다
spring:
  application:
    name: inventory-service
  datasource:                 # 접속할 DB (서비스마다 DB 를 따로 쓴다: inventory_db)
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/inventory_db}
    username: ${DB_USER:inventory_app}
    password: ${DB_PASSWORD:}   # 비밀번호는 파일에 적지 않고 .env 의 값을 환경 변수로 받는다
  servlet:
    multipart:
      max-file-size: 5MB        # 부품 요청 사진 한 장 (DB 의 CHECK 제약과 같은 값)
      max-request-size: 6MB     # 사진 1장 + 본문
  jpa:
    open-in-view: false       # 화면 응답을 만드는 동안 DB 연결을 붙잡아 두지 않는다 (트랜잭션은 Service 안에서만)
    hibernate:
      ddl-auto: validate      # 테이블을 만들거나 고치지 않고, Entity 와 테이블이 맞는지 검사만 한다
                              # (테이블은 Flyway 가 만든다. 다르면 서버가 시작하지 않는다)
  flyway:
    enabled: true             # 시작할 때 db/migration 의 V1, V2 ... 중 아직 적용 안 된 것을 순서대로 적용
    baseline-on-migrate: false  # 기록 없는 기존 DB 를 "이미 적용됨"으로 치지 않는다 (잘못된 테이블을 숨기지 않기 위해)
    locations: classpath:db/migration
fixops:
  # 권한 확인 (D13): 요청마다 Member 에 "이 사람이 이 조직의 ADMIN/TECHNICIAN 인가"를 묻는다 (Asset 과 같은 방식)
  member:
    url: ${MEMBER_SERVICE_URL:http://127.0.0.1:8081}       # dev.py 가 넘겨줌. Docker 에서는 http://member:8081
  internal:
    inventory-authz-key: ${INVENTORY_AUTHZ_KEY:}            # .env 의 값. Member 가 "Inventory 가 보낸 요청"인지 확인하는 열쇠
  workorder:
    # 실제 WorkOrder 호출 설정 (D11, HttpWorkOrderClient)
    #   직접 호출   : url=http://127.0.0.1:8083 (Docker 안에서는 http://workorder:8083), base-path=/work-orders
    #   Gateway 경유: url=Gateway 주소, base-path=/api/work-orders
    url: ${WORKORDER_SERVICE_URL:http://127.0.0.1:8083}   # dev.py 가 이미 이 이름으로 넘겨준다
    base-path: ${WORKORDER_BASE_PATH:/work-orders}
    connect-timeout-ms: ${WORKORDER_CONNECT_TIMEOUT_MS:2000}  # 연결 대기 2초 (Asset 과 같은 값)
    read-timeout-ms: ${WORKORDER_READ_TIMEOUT_MS:3000}        # 응답 대기 3초. 넘으면 503, 차감하지 않음
    # ⚠️ 가짜(FAKE) WorkOrder 사용 여부. true 면 실제 WorkOrder 를 부르지 않고 FakeWorkOrderClient 가 대답한다.
    #    로컬 개발·Postman 시험 전용. 기본은 false (실제 WorkOrder 를 부른다).
    #    켜는 법: 환경 변수 WORKORDER_FAKE=true 로 서버 실행
    #    TODO: 실제 연결 확인 후 아래 두 줄과 FakeWorkOrderClient 를 삭제 (늦어도 D15 전)
    fake: ${WORKORDER_FAKE:false}
    fake-technician-id: ${WORKORDER_FAKE_TECHNICIAN_ID:1}   # ⚠️ 가짜가 "배정된 기사"라고 대답할 회원 번호
management:
  endpoints:
    web:
      exposure:
        include: health,info  # /actuator/health 로 서버가 살아 있는지 확인 (Postman "0. 서버 확인")
